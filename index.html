<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>백수 위기 탈출: 실업 시티</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--y:#ffd23f;--g:#7bd66b;--r:#ff4d6d;--ink:#0b0c0f;--pn:#14161b;--line:#2c3038;--tx:#f4f1e8;
  --disp:'Jua','Black Han Sans','Noto Sans KR',system-ui,sans-serif;--body:'Noto Sans KR',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0c0f}
body{font-family:var(--body);font-weight:500;color:var(--tx);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}

/* 외곽선 글자 (게임 HUD 느낌) */
.gt{font-family:var(--disp);font-weight:400;color:#fff;letter-spacing:.02em;line-height:1.05;
  text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000,2px 2px #000,-2px 2px #000,2px -2px #000,-2px -2px #000,0 5px 0 #000}
.gt.y{color:var(--y)}.gt.g{color:var(--g)}.gt.r{color:var(--r)}

#city{position:fixed;inset:0;width:100%;height:100%;display:block;transition:filter .6s,transform 3.2s ease-out}
body.gray #city,body.gray #stage{filter:grayscale(1) contrast(1.2) brightness(.7)}
body.gray #city{transform:scale(1.1)}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#hudTL{position:absolute;left:16px;top:10px}
#hudCh{font-size:clamp(1.15rem,2.8vw,1.7rem);font-style:italic}
#hudTR{position:absolute;right:16px;top:4px;text-align:right}
#money{font-size:clamp(1.9rem,4.8vw,3rem);color:#6fd35e;letter-spacing:.03em}
#badges{display:flex;gap:1px;justify-content:flex-end;margin-top:-4px}
#badges b{font-family:var(--disp);font-weight:400;font-size:clamp(1.4rem,3.2vw,2.1rem);line-height:1;color:rgba(0,0,0,.45);text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
#badges b.on{color:#fff}
.hbtn{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
#mute,#radio,#full{color:#fff;border:2px solid #000;background:rgba(0,0,0,.6);font-size:.8rem;padding:.4em .6em;font-weight:800}
#radio.on{background:var(--y);color:#000}
#mapBox{position:absolute;left:16px;bottom:16px;width:min(30vw,236px);filter:drop-shadow(0 6px 0 rgba(0,0,0,.5))}
#radar{display:block;width:100%;border:3px solid #000;border-bottom:0;border-radius:8px 8px 0 0;background:#17191e}
.mbars{display:grid;grid-template-columns:2fr 1fr;gap:3px;background:#000;padding:3px;border-radius:0 0 8px 8px}
.mbars>div{height:10px;position:relative;overflow:hidden}
#gauge{background:#1f3a1b}#gauge i{display:block;height:100%;background:#6fd35e;transition:width .6s}
#gauge.low i{background:var(--r)}
#xp{background:#16293d}#xp i{display:block;height:100%;width:0;background:#57a8ff;transition:width .6s}
.mlab{display:grid;grid-template-columns:2fr 1fr;gap:3px;font-size:.66rem;font-weight:800;text-shadow:0 1px 2px #000;padding:2px 3px 0}
#hudObj{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:max-content;max-width:min(50vw,620px);text-align:center;font-weight:800;font-size:clamp(1rem,2.3vw,1.35rem);line-height:1.35;word-break:keep-all;
  text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000,1px 1px #000,-1px -1px #000,1px -1px #000,-1px 1px #000,0 3px 6px #000}
#nav{position:absolute;left:50%;top:70px;transform:translateX(-50%);display:none;align-items:center;gap:12px;pointer-events:none;background:rgba(10,12,18,.82);border:3px solid #000;box-shadow:0 0 0 3px var(--y),0 6px 0 rgba(0,0,0,.45);border-radius:999px;padding:6px 22px 6px 8px}
#nav .ar{width:clamp(46px,7vw,62px);height:clamp(46px,7vw,62px);flex:none;transition:transform .12s linear}
#nav .ar svg{width:100%;height:100%;display:block}
#nav .tx{display:flex;flex-direction:column;line-height:1.1}
#nav .nm{font-family:var(--disp);font-size:clamp(1.25rem,3vw,1.8rem);color:var(--y);text-shadow:2px 2px 0 #000}
#nav .ds{font-weight:800;font-size:clamp(.95rem,2.2vw,1.2rem);color:#fff}
#hurt{position:fixed;inset:0;z-index:40;pointer-events:none;display:grid;place-items:center;opacity:0;background:radial-gradient(ellipse at center,rgba(255,0,40,0) 35%,rgba(255,0,40,.6) 100%)}
#hurt b{font-family:var(--disp);font-weight:400;font-size:clamp(3rem,11vw,7rem);color:#ff4d6d;-webkit-text-stroke:3px #000;text-shadow:5px 5px 0 #000;transform:rotate(-8deg)}
#hurt.on{animation:hurtA 1.6s ease-out forwards}
#hurt.on b{animation:hurtB 1.6s ease-out forwards}
@keyframes hurtA{0%{opacity:1}55%{opacity:1}100%{opacity:0}}
@keyframes hurtB{0%{transform:scale(2.4) rotate(-8deg)}14%{transform:scale(.9) rotate(-8deg)}22%{transform:scale(1.05) rotate(-6deg)}100%{transform:scale(1) rotate(-8deg)}}
#cap{position:absolute;left:0;right:0;bottom:150px;text-align:center;font-size:clamp(1.3rem,3.4vw,2rem);display:none;pointer-events:none}
#fade{position:fixed;inset:0;z-index:27;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
#drive{position:absolute;right:16px;bottom:78px;border:3px solid #000;background:#e23b3b;color:#fff;font-family:var(--disp);font-size:1.15rem;padding:.45em .9em;box-shadow:0 5px 0 #000;display:none}
#drive.on{display:block}
#talk{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);border:3px solid #000;background:#fff;color:#000;font-family:var(--disp);font-size:1.2rem;padding:.5em 1em;box-shadow:0 5px 0 #000;display:none;animation:pop .25s;white-space:nowrap}
#talk.on{display:block}
#mgbar{position:fixed;left:50%;top:56px;transform:translateX(-50%);z-index:6;display:none;align-items:center;gap:12px;background:rgba(0,0,0,.78);border:3px solid #000;padding:6px 14px;width:min(720px,94vw)}
#mgbar.on{display:flex}
#mgbar .season{flex:1}
#news{position:fixed;left:0;right:0;top:0;z-index:28;display:flex;align-items:center;gap:12px;background:#b3121f;border-bottom:4px solid #000;padding:8px 14px;font-weight:800;font-size:clamp(.95rem,2.3vw,1.25rem);transform:translateY(-110%);transition:transform .4s;word-break:keep-all}
#news.on{transform:none}
#news b{font-family:var(--disp);font-weight:400;background:#fff;color:#b3121f;padding:.15em .6em;white-space:nowrap}
#taxi{position:absolute;right:16px;bottom:18px;border:3px solid #000;background:var(--y);color:#000;font-family:var(--disp);font-size:1.25rem;padding:.5em 1em;box-shadow:0 5px 0 #000;display:none}
#taxi.on{display:block}
#mtitle{position:absolute;right:22px;bottom:92px;text-align:right;transform:translateX(130%);transition:transform .5s cubic-bezier(.2,1.2,.4,1)}
#mtitle.on{transform:none}
#mtitle .a{font-size:clamp(1.3rem,3.2vw,2rem);font-style:italic}
#mtitle .b{font-size:clamp(2.6rem,8vw,5rem);font-style:italic}
#pass{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(0,0,0,.6),rgba(0,0,0,.93));-webkit-backdrop-filter:blur(3px) saturate(.5);backdrop-filter:blur(3px) saturate(.5)}
#pass.on{display:flex}
.pz{width:min(600px,90vw);text-align:center}
.pt{font-size:clamp(3.2rem,11vw,6rem);font-style:italic;animation:pop .45s}
.pl{height:5px;background:var(--y);margin:10px 0 14px;transform-origin:left;animation:grow .5s}
.pr{display:flex;justify-content:space-between;gap:20px;font-weight:800;font-size:clamp(1.1rem,2.9vw,1.6rem);padding:.3em .2em;border-bottom:1px solid rgba(255,255,255,.22);opacity:0;animation:slide .35s forwards}
.pr b{color:var(--y)}
.pm{margin-top:16px;font-family:var(--disp);font-size:clamp(1.7rem,5vw,2.8rem);opacity:0;animation:pop .4s forwards;text-shadow:0 4px 0 #000}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes slide{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}

/* 무대 */
#stage{position:fixed;inset:0;z-index:10;display:none;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#stage.on{display:block}
.full{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
.dim{background:rgba(5,6,9,.86)}
.pn{background:var(--pn);border:3px solid #000;box-shadow:0 0 0 2px var(--line),0 12px 0 rgba(0,0,0,.5);padding:18px;width:min(900px,96vw)}
.pn.stripe{border-top:8px solid var(--y)}
.h1{font-size:clamp(1.6rem,5vw,2.8rem)}
.h2{font-size:clamp(1.2rem,3.3vw,1.8rem)}
.lead{font-size:clamp(1rem,2.4vw,1.3rem);font-weight:800;word-break:keep-all;line-height:1.5}
.small{font-size:.95rem;opacity:.8;word-break:keep-all}
.btn{border:3px solid #000;background:var(--y);color:#000;font-family:var(--disp);font-size:clamp(1.1rem,3vw,1.5rem);padding:.5em 1.4em;box-shadow:0 6px 0 #000;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
.btn:disabled{filter:grayscale(1);opacity:.5}
.btn.dark{background:#22262e;color:#fff}

/* 선택지 */
.opts{display:grid;gap:10px;width:100%}
.opts.c2{grid-template-columns:1fr 1fr}
.opt{--c:var(--y);display:flex;align-items:center;gap:12px;text-align:left;background:#1d2027;border:3px solid #000;border-left:10px solid var(--c);padding:.7em .9em;font-weight:800;font-size:clamp(1rem,2.5vw,1.3rem);word-break:keep-all;box-shadow:0 5px 0 #000;transition:transform .06s}
.opt .e{font-size:1.7em;line-height:1}
.opt:active{transform:translateY(3px)}
.opt.no{animation:shake .35s;opacity:.35;pointer-events:none;text-decoration:line-through}
.opt.yes{background:var(--g);color:#000;border-left-color:#000}
.ask{background:#000;border:2px dashed var(--y);color:var(--y);padding:.6em .9em;font-weight:800;word-break:keep-all;min-height:3.2em;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.ask:empty{visibility:hidden}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:none;opacity:1}}
@keyframes rise{to{transform:translateY(-60px);opacity:0}}

/* 자막 */
#sub{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;padding:12px;pointer-events:auto}
#sub.on{display:block}
#sub .box{margin:0 auto;max-width:980px;background:rgba(0,0,0,.88);border:3px solid #000;box-shadow:0 0 0 2px var(--line);display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 18px;align-items:center;min-height:118px}
#sub .face{font-size:clamp(3rem,9vw,4.6rem);line-height:1}
#sub .who{font-family:var(--disp);color:var(--y);font-size:1.25rem;margin-bottom:4px}
#sub .txt{font-size:clamp(1.05rem,2.7vw,1.45rem);font-weight:800;line-height:1.45;word-break:keep-all;min-height:2.9em}
#sub .nx{grid-column:2;text-align:right;font-size:.85rem;opacity:.7;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

/* 배너 */
#banner{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none}
#banner.on{display:flex}
#banner .band{width:100%;padding:22px 10px;text-align:center;background:linear-gradient(90deg,transparent,rgba(0,0,0,.85) 20%,rgba(0,0,0,.85) 80%,transparent);animation:pop .5s}
#banner .big{font-size:clamp(3rem,12vw,7rem)}
#banner .sm{font-size:clamp(1.1rem,3.2vw,1.8rem);margin-top:8px}
#toast{position:fixed;left:50%;top:76px;z-index:40;transform:translate(-50%,-260%);transition:transform .3s;background:#000;border:3px solid var(--y);padding:.5em 1.1em;font-weight:800;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{transform:translate(-50%,0)}
#toast.bad{border-color:var(--r)}#toast.good{border-color:var(--g)}
.fly{position:fixed;z-index:35;font-family:var(--disp);font-size:1.6rem;pointer-events:none;animation:rise 1.1s forwards;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}

/* 입장 · 포스터 */
#sJoin{position:fixed;inset:0;z-index:50;display:none;background:#0b0c0f;overflow:auto}
#sJoin.on{display:block}
.poster{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr;gap:0}
.panels{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:1.25fr 1fr;gap:10px;padding:10px;background:#000;transform:skewX(-4deg);margin-left:-26px;padding-left:36px;min-height:46vh}
.panels div{border:5px solid #000;position:relative;overflow:hidden;background:#111}
.panels svg{position:absolute;inset:0;width:100%;height:100%;transform:skewX(4deg) scale(1.12)}
.panels div::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(0,0,0,.28) 1.2px,transparent 1.6px) 0 0/7px 7px;mix-blend-mode:multiply;pointer-events:none}
.panels div span{position:absolute;left:10px;bottom:8px;z-index:2;font-family:var(--disp);font-style:italic;font-size:clamp(.9rem,2.2vw,1.4rem);color:#fff;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 4px 0 #000}
.joinbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px}
.logo .a{font-size:clamp(1.1rem,3vw,1.7rem);font-style:italic}
.logo .b{font-size:clamp(2.6rem,8.5vw,5.4rem);font-style:italic}
.input{width:min(380px,84vw);border:3px solid #000;outline:0;background:#fff;color:#000;font-weight:800;font-size:1.35rem;text-align:center;padding:.55em;box-shadow:0 6px 0 #000}
.input.err{animation:shake .35s}
@media (max-width:760px),(orientation:portrait){.poster{grid-template-columns:1fr}.panels{transform:none;min-height:30vh}}

/* 미니게임 공통 */
.mg{min-height:100%;display:flex;flex-direction:column;gap:10px;padding:12px}
.mgTop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mgTop .sp{flex:1}
.tm{font-size:clamp(1.5rem,4.5vw,2.4rem);min-width:2.6em;text-align:right}
.cnt{font-size:clamp(1.4rem,4vw,2.2rem)}
.how{background:#000b;padding:.35em .8em;font-weight:800;border-left:5px solid var(--y);word-break:keep-all}

/* 1장 농장 */
.farm{background:repeating-linear-gradient(0deg,#5b3a1e 0 42px,#6b4524 42px 84px);transition:background 1.2s}
.farm.cold{background:repeating-linear-gradient(0deg,#9fb3c2 0 42px,#c9d8e2 42px 84px)}
.season{flex:1;min-width:150px;height:22px;background:#000;border:2px solid #000;position:relative;overflow:hidden}
.season i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#f59e0b,#fb923c 55%,#93c5fd 85%,#fff)}
.season span{position:absolute;top:1px;font-size:.8rem;font-weight:800;text-shadow:0 1px 2px #000}
.season .s1{left:6px}.season .s2{right:6px}
.holes{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-content:center;max-width:900px;width:100%;margin:0 auto}
.hole{aspect-ratio:1.25;border:0;border-radius:50%;background:radial-gradient(ellipse at 50% 60%,#2a1708 0 55%,#3f240f 56% 100%);position:relative;font-size:clamp(2.4rem,8vw,4.4rem);display:grid;place-items:center;padding:0}
.farm.cold .hole{background:radial-gradient(ellipse at 50% 60%,#dfe9f0 0 55%,#b8c8d4 56% 100%)}
.hole span{display:block;transform:translateY(60%) scale(.2);opacity:0;transition:transform .14s,opacity .14s;pointer-events:none}
.hole.up span{transform:none;opacity:1}
.hole.gold span{filter:drop-shadow(0 0 10px #ffd23f) saturate(1.6) hue-rotate(-40deg)}
.hole.hit span{transform:translateY(-70%) scale(1.3) rotate(20deg);opacity:0;transition:.25s}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-20px;color:#fff;font-style:normal;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}

/* 2장 콜센터 */
.call{background:linear-gradient(180deg,#0f1b2d,#152a45)}
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lane{background:#000a;border:3px solid #000;padding:10px;text-align:center}
.lane.ai{border-color:#b06bff;opacity:.25;transition:opacity .4s}
.lane.ai.on{opacity:1}
.lane .n{font-size:clamp(1.8rem,6vw,3.2rem)}
.lane .s{font-size:.9rem;font-weight:800;opacity:.85}
.qbox{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;max-width:820px;width:100%;margin:0 auto;position:relative}
.bubble{background:#fff;color:#000;border:3px solid #000;padding:.8em 1em;font-weight:800;font-size:clamp(1.1rem,3vw,1.6rem);position:relative;box-shadow:0 6px 0 #000;word-break:keep-all;display:flex;gap:12px;align-items:center;text-align:left}
.bubble .e{font-size:2em}
.stamp{position:absolute;right:8px;top:-18px;background:#b06bff;color:#fff;border:3px solid #000;font-family:var(--disp);padding:.2em .6em;transform:rotate(6deg);animation:pop .2s;font-size:1.1rem}

/* 3장 식당 */
.rest{background:linear-gradient(180deg,#3b2414,#5a371f)}
.tv{background:#000;border:4px solid #222;padding:.4em .8em;font-weight:800;color:#fff;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv.alert{background:#7a0f22;animation:blink .6s 4}
.tables{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:center;max-width:860px;width:100%;margin:0 auto}
.tb{aspect-ratio:1.5;border:3px solid #000;background:#8b5a2b;box-shadow:inset 0 0 0 6px #a06a36,0 6px 0 #000;position:relative;display:grid;place-items:center;font-size:clamp(1.8rem,6vw,3rem);padding:0}
.tb .c{opacity:0;transition:opacity .2s}
.tb.busy .c{opacity:1}
.tb .o{position:absolute;right:4px;top:-14px;background:#fff;border:3px solid #000;border-radius:50%;width:1.7em;height:1.7em;display:none;place-items:center;font-size:.75em}
.tb.busy .o{display:grid}
.tb .p{position:absolute;left:6px;right:6px;bottom:5px;height:6px;background:#000}
.tb .p i{display:block;height:100%;background:var(--g);width:100%}
.tb.ok{background:var(--g)}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:860px;width:100%;margin:0 auto}
.dish{border:3px solid #000;background:#fff;font-size:clamp(1.8rem,6vw,2.8rem);padding:.15em;box-shadow:0 5px 0 #000}
.dish.sel{background:var(--y);transform:translateY(-6px)}
.sales{display:flex;gap:6px;align-items:flex-end;height:44px}
.sales b{width:26px;background:var(--g);border:2px solid #000;min-height:4px;transition:height .4s;font-size:.7rem;color:#000;text-align:center}

/* 4장 폰 */
.phone{width:min(430px,94vw);height:min(88vh,720px);background:#0d0f14;border:5px solid #000;border-radius:34px;box-shadow:0 0 0 3px #3a3f4b,0 20px 0 rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;animation:phoneUp .5s cubic-bezier(.2,1.1,.4,1)}
@keyframes phoneUp{from{transform:translateY(110%) rotate(8deg)}}
.phone .bar{background:#b06bff;color:#fff;padding:.6em 1em;font-family:var(--disp);font-size:1.15rem;display:flex;gap:8px;align-items:center;border-bottom:3px solid #000}
.phone .log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y}
.msg{max-width:86%;padding:.55em .8em;border:2px solid #000;font-weight:800;word-break:keep-all;text-align:left;animation:pop .2s;line-height:1.4}
.msg.b{align-self:flex-start;background:#262b36}
.msg.u{align-self:flex-end;background:var(--y);color:#000}
.msg.typing{letter-spacing:.3em;opacity:.7}
.chips{display:flex;gap:8px;padding:10px;flex-wrap:wrap;justify-content:center;border-top:3px solid #000;background:#151821;min-height:64px}
.chip{border:3px solid #000;background:#fff;color:#000;font-weight:800;padding:.45em .9em;box-shadow:0 4px 0 #000}
.rec{background:#fff;color:#000;border:2px solid #000;padding:.5em .7em;text-align:left;font-weight:800;animation:pop .25s}
.rec small{display:block;font-weight:500;opacity:.8}
.scan{height:10px;background:#000;border:2px solid #000}.scan i{display:block;height:100%;width:0;background:#b06bff;transition:width 1.4s linear}

/* 4장 체험 */
.trial{background:linear-gradient(180deg,#0e2231,#12384a)}
.grid9{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:center;max-width:560px;width:100%;margin:0 auto}
.cell{aspect-ratio:1.2;border:3px solid #000;background:#1d2a36;font-size:clamp(2rem,7vw,3.4rem);box-shadow:0 5px 0 #000;padding:0}
.cell.lit{background:var(--y);animation:pop .15s}
.meter{position:relative;height:64px;background:#111;border:3px solid #000;max-width:760px;width:100%;margin:0 auto}
.meter .z{position:absolute;top:0;bottom:0;background:var(--g)}
.meter .nd{position:absolute;top:-10px;bottom:-10px;width:8px;background:#fff;border:2px solid #000;margin-left:-4px}
.item{font-size:clamp(1.3rem,4vw,2rem);background:#fff;color:#000;border:3px solid #000;padding:.7em 1em;font-weight:800;box-shadow:0 6px 0 #000;min-width:min(420px,80vw);animation:pop .15s}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:760px;width:100%;margin:0 auto}

/* 상담소 */
.csl{background:linear-gradient(180deg,#161a22,#1f2733)}
.tbar{flex:1;min-width:120px;height:16px;background:#000;border:2px solid #000}
.tbar i{display:block;height:100%;background:var(--y);width:100%}
.tbar.low i{background:var(--r)}
.visitor{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;max-width:820px;width:100%;margin:0 auto}
.visitor .bubble{animation:walkIn .35s}
@keyframes walkIn{from{transform:translateX(-60vw)}}
.visitor.back .bubble{animation:shake .35s}
.wins{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:980px;width:100%;margin:0 auto}
.win{--c:#888;border:3px solid #000;border-top:10px solid var(--c);background:#1d2027;padding:.5em .2em;font-weight:800;font-size:clamp(.85rem,2.2vw,1.15rem);box-shadow:0 5px 0 #000;word-break:keep-all}
.win .e{display:block;font-size:1.8em}
.win.no{opacity:.25;pointer-events:none}
.win.yes{background:var(--c);color:#000}
@media (max-width:620px){.wins{grid-template-columns:repeat(3,1fr)}}

/* 엔딩 표 */
.tbl{display:grid;grid-template-columns:auto 1.2fr .8fr 1fr 1.4fr;gap:4px;width:min(1040px,97vw);font-size:clamp(.72rem,1.75vw,1rem)}
.tbl>div{background:#1d2027;border:2px solid #000;padding:.5em .4em;font-weight:800;word-break:keep-all;display:flex;align-items:center;justify-content:center;text-align:center;min-height:3.4em}
.tbl .hd{background:#000;color:var(--y);font-family:var(--disp);font-weight:400;min-height:0}
.tbl .ty{color:#000}
.tbl .ok{background:#17351f;border-color:var(--g)}
.tbl .bad{background:#4a1522;border-color:var(--r);animation:blink 1.2s infinite;cursor:pointer}
.tbl .q{background:#3a3210;border-color:var(--y);cursor:pointer;animation:blink 1.2s infinite}
#pick{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:14px}
#pick.on{display:flex}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 18px;text-align:left;font-weight:800;font-size:clamp(1rem,2.6vw,1.35rem);width:100%}
.stats b{color:var(--y);text-align:right}
.wait{background:#000c;border:3px solid #000;padding:.6em 1em;font-weight:800}

/* ── 손그림 아이콘 ── */
.ic{width:1.2em;height:1.2em;vertical-align:-.25em;display:inline-block;overflow:visible}
.ic.face{width:1.35em;height:1.4em}
#sub .face .ic{width:1em;height:1em;vertical-align:0}
#sub .face .ic.face{width:1.25em;height:1.3em}
.bubble .e .ic{width:1.5em;height:1.55em}
/* ── 블록 장난감풍: 둥근 글씨·둥근 모서리 ── */
.gt,#mtitle .a,#mtitle .b,.pt,#hudCh,.logo .a,.logo .b,.panels div span{font-style:normal!important;letter-spacing:0}
.btn,#taxi,#drive,#talk,#mute,#radio,#full,.chip,.dish,.cell,.win,.opt,.input,.item,.hole,.tb{border-radius:16px}
.pn{border-radius:24px;background:#1b2440;box-shadow:0 0 0 3px #000,0 10px 0 rgba(0,0,0,.45)}
.pn.stripe{border-top:10px solid var(--y)}
.opt{background:#27325a}
.ask{border-radius:14px}
#sub .box{border-radius:26px;background:#fff;color:#151515;box-shadow:0 0 0 3px #000,0 8px 0 rgba(0,0,0,.35)}
#sub .who{color:#2f6fdb}#sub .nx{opacity:.55}
#radar{border-radius:18px 18px 0 0!important}.mbars{border-radius:0 0 18px 18px!important}
#mgbar,#toast,.wait,.how,.tv,.lane,.msg,.rec{border-radius:14px}
#mgbar{background:rgba(20,28,56,.9)}
#news{border-radius:0 0 18px 18px}
.phone{border-radius:38px}.bubble{border-radius:18px}
.dim{background:rgba(14,22,48,.88)}
.tbl>div{border-radius:10px}
#money{color:#fff}
</style>
</head>
