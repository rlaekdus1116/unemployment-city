<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>실업 시티 · 진행판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{--y:#ffd23f;--g:#7bd66b;--r:#ff4d6d;--pn:#14161b;--line:#2c3038;--tx:#f4f1e8;--disp:'Jua','Black Han Sans','Noto Sans KR',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans KR',system-ui,sans-serif;font-weight:500;color:var(--tx);overflow:hidden;
  background:#0b0c0f repeating-linear-gradient(135deg,transparent 0 38px,rgba(255,210,63,.035) 38px 40px)}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.gt{font-family:var(--disp);font-weight:400;color:#fff;letter-spacing:.02em;line-height:1.08;margin:0;
  text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000,2px 2px #000,-2px 2px #000,2px -2px #000,-2px -2px #000,0 5px 0 #000}
.gt.y{color:var(--y)}.gt.g{color:var(--g)}
.pn{background:var(--pn);border:3px solid #000;box-shadow:0 0 0 2px var(--line),0 8px 0 rgba(0,0,0,.5);padding:14px}
.pn.stripe{border-top:8px solid var(--y)}
.btn{border:3px solid #000;background:var(--y);color:#000;font-family:var(--disp);font-size:1.1rem;padding:.5em 1em;box-shadow:0 5px 0 #000;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
.btn:disabled{filter:grayscale(1);opacity:.45;cursor:default}
.btn.dark{background:#22262e;color:#fff}.btn.red{background:var(--r);color:#fff}.btn.green{background:var(--g)}
.btn.sm{font-size:.92rem;padding:.4em .7em}.btn.wide{width:100%}
.btn.onx{background:#fff;outline:3px solid var(--y)}
.pill{background:#000;border:2px solid var(--line);padding:.3em .8em;font-weight:800;white-space:nowrap}
.pill.ok{border-color:var(--g);color:var(--g)}.pill.no{border-color:var(--r);color:var(--r)}
.sp{flex:1}
.gate{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center}
.gate .pn{display:flex;flex-direction:column;gap:14px;align-items:center;padding:30px 40px}
.input{border:3px solid #000;outline:0;background:#fff;color:#000;font-weight:800;font-size:1.3rem;text-align:center;padding:.5em;width:230px;box-shadow:0 5px 0 #000}
#app{height:100vh;display:flex;flex-direction:column;padding:12px 16px 16px;gap:12px}
.hdr{display:flex;align-items:center;gap:10px}
.hdr h1{font-size:1.9rem;font-style:italic}
.body{flex:1;display:flex;gap:14px;min-height:0}
.dock{width:300px;flex:none;overflow:auto;display:flex;flex-direction:column;gap:8px}
.dock.hide{display:none}
.dock h3{margin:6px 0 0;font-size:.95rem;font-weight:800;color:var(--y)}
.chs{display:flex;flex-direction:column;gap:5px}
.chb{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;text-align:left;border:2px solid #000;background:#1d2027;padding:.4em .6em;font-weight:800;font-size:.95rem}
.chb small{opacity:.65;font-weight:500}
.chb.open{background:#24351f;border-color:var(--g)}
.chb.now{background:var(--y);color:#000}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:.82rem;opacity:.75;line-height:1.5;margin:0;word-break:keep-all}
.demo{background:#3a3210;border:2px solid var(--y);padding:8px 10px;font-size:.85rem;font-weight:800}
.tstage{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;overflow:auto}
/* 대기실 */
.lobby{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin:auto 0}
.qrcard{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.qrcard svg{width:290px;height:290px;background:#fff}
.url{font-size:1.2rem;font-weight:800;word-break:break-all;max-width:320px}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fl{--c:#999;border:3px solid #000;border-top:10px solid var(--c);background:#1d2027;padding:12px;font-weight:800;word-break:keep-all}
.fl .i{font-size:2.4rem}.fl .n{font-family:var(--disp);font-size:1.3rem;color:var(--c)}
.names{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:150px;overflow:auto}
.nm{background:#000;border:2px solid var(--line);padding:.25em .7em;font-weight:800;font-size:.95rem}
.nm.off{opacity:.35}
/* 현황판 */
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;min-height:190px;flex:none}
.col{background:#111318;border:3px solid #000;display:flex;flex-direction:column;min-width:0;opacity:.45}
.col.open{opacity:1}
.col .hd{font-family:var(--disp);padding:.4em .5em;background:#000;color:var(--y);font-size:1rem;display:flex;justify-content:space-between;gap:4px;white-space:nowrap}
.col.now .hd{background:var(--y);color:#000}
.col .ls{flex:1;overflow:auto;padding:6px;display:flex;flex-direction:column;gap:4px}
.st{background:#22262e;border-left:5px solid var(--y);padding:.2em .5em;font-weight:800;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.off{opacity:.35}.st.done{border-left-color:var(--g)}
.st i{display:block;height:3px;background:var(--g);margin-top:2px}
.row2{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:140px 1fr 170px;align-items:center;gap:10px;font-weight:800;white-space:nowrap}
.bar .tr{height:20px;background:#000;border:2px solid #000}
.bar .tr i{display:block;height:100%;--c:var(--g);background:var(--c);transition:width .6s}
.talk{font-size:1.25rem;font-weight:800;line-height:1.5;word-break:keep-all}
.talk b{color:var(--y)}
/* 결과 */
.endgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hc{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#1d2027;border:2px solid #000;padding:8px 12px;font-weight:800;word-break:keep-all;margin-top:6px}
.hc .e{font-size:1.8rem}.hc .b{--c:#999;background:var(--c);color:#000;padding:.2em .6em;white-space:nowrap}
.tbl{display:grid;grid-template-columns:auto 1.2fr .7fr 1fr 1.5fr;gap:4px;font-size:1rem}
.tbl>div{background:#1d2027;border:2px solid #000;padding:.5em;font-weight:800;word-break:keep-all;display:flex;align-items:center;justify-content:center;text-align:center}
.tbl .hd{background:#000;color:var(--y);font-family:var(--disp);font-weight:400}.tbl .ty{color:#000}
.big3{font-family:var(--disp);font-size:1.3rem;color:var(--y);margin:0 0 8px}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85)}
.modal.on{display:flex}
.modal .pn{display:flex;flex-direction:column;gap:12px;align-items:center;padding:26px}
.modal svg{width:min(70vh,560px);height:min(70vh,560px);background:#fff}

.ic{width:1.2em;height:1.2em;vertical-align:-.25em;display:inline-block;overflow:visible}
.gt,.hdr h1{font-style:normal!important;letter-spacing:0}
.pn{border-radius:18px}.btn,.pill,.chb,.input,.st,.hc,.nm{border-radius:12px}
</style>
</head>
<body>
<div id="gate" class="gate">
  <div class="pn stripe">
    <div class="gt y" style="font-size:1.3rem;font-style:italic">백수 위기 탈출</div>
    <h1 class="gt" style="font-size:2.8rem;font-style:italic">실업 시티 진행판</h1>
    <input id="code" class="input" type="password" placeholder="암호">
    <button id="enter" class="btn">들어가기</button>
  </div>
</div>

<div id="app" hidden>
  <header class="hdr">
    <h1 class="gt">실업 시티</h1>
    <span id="conn" class="pill"></span>
    <span class="pill">👥 접속 <b id="online">0</b>명</span>
    <span class="pill">⏱ <b id="clock">0:00</b> <span id="rec" style="opacity:.7"></span></span>
    <span class="sp"></span>
    <button class="btn sm dark" id="btnRadio">📻 라디오 꺼짐</button>
    <input type="range" id="radioVol" min="0" max="100" value="50" style="width:90px;accent-color:#ffd23f" title="음량">
    <button class="btn sm" id="btnQR">📱 QR</button>
    <button class="btn sm dark" id="btnDock">🎛 조작판</button>
  </header>
  <div class="body">
    <aside id="dock" class="dock pn">
      <button class="btn wide green" id="bNext">▶ 수업 시작</button>
      <h3>챕터 열기 (누른 곳까지 한꺼번에 열림)</h3>
      <div class="chs" id="chs"></div>
      <div class="grid2">
        <button class="btn sm dark" id="bFast">⏩ 빨리 감기</button>
        <button class="btn sm dark" id="bLobby">🏠 대기실</button>
      </div>
      <button class="btn wide red" id="bEnd">🏁 모두 엔딩으로 + 반 결과</button>
      <div class="grid2">
        <button class="btn sm dark" id="bCsv">📥 엑셀</button>
        <button class="btn sm dark" id="bClear">🧹 기록 지우기</button>
      </div>
      <p class="note"><b>⏩ 빨리 감기</b>: 미니게임 60→30초, 상담소 12→8명 (켠 뒤 시작하는 게임부터 적용).<br><b>🏁 엔딩</b>: 덜 끝낸 학생도 비교표로 넘어가요.<br>반이 바뀌면 <b>🧹 기록 지우기</b> → 학생 태블릿도 입장 화면으로 돌아가요.</p>
      <div class="demo" id="demo" hidden>🧪 체험 모드 — shared.js 에 Firebase 열쇠가 없어요. 같은 브라우저 다른 탭에서 index.html 을 열면 연결돼요.</div>
    </aside>
    <main id="stage" class="tstage"></main>
  </div>
</div>
<div id="qrModal" class="modal"><div class="pn"><div id="qrBig"></div><div class="url" id="qrUrl" style="max-width:600px;font-size:1.5rem"></div><button class="btn" id="qrClose">닫기</button></div></div>

<script src="shared.js"></script>
<script>
(async () => {
'use strict';
const { TYPES, TK, NONE, tinfo, CAUSES, POLICIES, CHAPTERS, JOBS, caseById, esc, won } = UC;
const $ = s => document.querySelector(s);
UC.handDrawn();          // 이모지를 전부 손그림으로

/* 문 */
function openApp() { $('#gate').style.display = 'none'; $('#app').hidden = false; sessionStorage.setItem('unempCity.t', '1'); }
$('#enter').onclick = () => { if ($('#code').value === UC.TEACHER_CODE) openApp(); else { $('#code').value = ''; $('#code').placeholder = '암호가 달라요'; } };
$('#code').addEventListener('keydown', e => { if (e.key === 'Enter') $('#enter').click(); });
if (sessionStorage.getItem('unempCity.t') === '1') openApp();

let store = null;
function setConn(ok) { const c = $('#conn'); if (store?.mode === 'local') { c.textContent = '🧪 체험 모드'; c.className = 'pill'; return; } c.textContent = ok ? '● 연결됨' : '● 연결 안 됨'; c.className = 'pill ' + (ok ? 'ok' : 'no'); }
store = await UC.makeStore(setConn);
if (store.mode === 'local') $('#demo').hidden = false;
setConn(true);

let S = {}, PL = {}, firstP = true, stageKey = '', hist = [];
const online = p => (p.seen || 0) > Date.now() - 70000;
const TALK = [
  '<b>실업</b>이란? 일할 <b>능력</b>과 <b>의사</b>가 있는데도 일자리가 없는 상태. 근로는 둘 다 있는데… 과연?',
  '근로가 배추를 <b>두 배로 더 잘</b> 뽑았다면 겨울에도 일할 수 있었을까?',
  'AI가 대신하게 된 일은 <b>경기가 좋아지면</b> 다시 돌아올까? 계절적 실업과 뭐가 다를까?',
  '식당만 어려운 걸까, <b>도시 전체</b>가 어려운 걸까? 옆 가게 셔터는 왜 내려갔을까?',
  '이번엔 누가 근로를 내보냈나? <b>스스로</b> 찾는 중인 실업은 나쁜 걸까?',
  '<b>학생·은퇴한 할아버지</b>는 왜 실업자가 아닐까? 실업의 뜻을 다시 떠올려 봐요.',
  '네 가지 실업 중 <b>근로 탓</b>이었던 건 몇 개? 그래서 누구의 대책이 필요할까?'
];

/* 조작 */
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function recCh() {            // 지금 시각에 권장되는 챕터
  if (!S.startAt || S.status !== 'run') return -1;
  const m = (Date.now() - S.startAt) / 60000 * (S.fast ? 1.6 : 1); let acc = 0, r = 0;
  CHAPTERS.forEach(c => { if (m >= acc) r = c.n; acc += c.min; }); return r;
}
function renderDock() {
  const st = S.status || 'lobby', live = st === 'run' || st === 'end', open = st === 'end' ? 6 : (S.open ?? -1), rc = recCh();
  $('#chs').innerHTML = CHAPTERS.map(c => `<button class="chb ${live && c.n <= open ? 'open' : ''} ${live && c.n === open ? 'now' : ''}" data-n="${c.n}">
    <span>${live && c.n <= open ? '🔓' : '🔒'}</span><span>${c.name}${c.t ? ` <small>${TYPES[c.t].icon} ${TYPES[c.t].short}</small>` : ''}</span><small>${c.at}${rc === c.n ? ' ◀' : ''}</small></button>`).join('');
  document.querySelectorAll('.chb').forEach(b => b.onclick = () => openTo(+b.dataset.n));
  const nb = $('#bNext');
  if (st === 'end') { nb.textContent = '🏁 엔딩 공개 중'; nb.disabled = true; }
  else if (st !== 'run') { nb.textContent = '▶ 수업 시작 (오프닝 열기)'; nb.disabled = false; }
  else if (open < 6) { nb.textContent = `⏭ 다음 열기: ${CHAPTERS[open + 1].name}`; nb.disabled = false; }
  else { nb.textContent = '모든 챕터가 열렸어요'; nb.disabled = true; }
  $('#bFast').classList.toggle('onx', !!S.fast); $('#bFast').textContent = S.fast ? '⏩ 빨리 감기 켜짐' : '⏩ 빨리 감기';
}
function openTo(n) { const p = { status: 'run', open: n }; if (S.status !== 'run' || !S.startAt) p.startAt = Date.now(); store.setState(p); }
$('#bNext').onclick = () => openTo(S.status === 'run' ? Math.min(6, (S.open ?? -1) + 1) : 0);
$('#bFast').onclick = () => store.setState({ fast: !S.fast });
$('#bLobby').onclick = () => store.setState({ status: 'lobby' });
$('#bEnd').onclick = () => { if (confirm('모든 학생을 엔딩(비교표)으로 보내고 반 결과를 띄울까요?')) store.setState({ status: 'end', open: 6 }); };
$('#bClear').onclick = async () => {
  if (!confirm('학생 기록을 모두 지울까요? (먼저 엑셀로 받아 두세요)')) return;
  hist = []; await store.clearPlayers(); await store.setState({ resetAt: Date.now(), status: 'lobby', open: -1, startAt: 0, fast: false });
};
$('#btnDock').onclick = () => $('#dock').classList.toggle('hide');
$('#btnRadio').onclick = () => { UC.Radio.next(); $('#btnRadio').textContent = UC.Radio.label(); $('#btnRadio').classList.toggle('onx', UC.Radio.cur >= 0); };
$('#radioVol').oninput = e => UC.Radio.volume(e.target.value / 100);
function studentURL() { return location.protocol === 'file:' ? new URL('index.html', location.href).href : new URL('./', location.href).href; }
function qrSVG(url, cell = 8) { if (!window.qrcode) return '<div style="padding:30px">QR 불러오기 실패 — 주소를 칠판에 써 주세요</div>'; const q = qrcode(0, 'M'); q.addData(url); q.make(); return q.createSvgTag({ cellSize: cell, margin: 2, scalable: true }); }
$('#btnQR').onclick = () => { const u = studentURL(); $('#qrBig').innerHTML = qrSVG(u, 12); $('#qrUrl').innerHTML = esc(u) + `<div style="font-size:1rem;opacity:.75;margin-top:8px">🎮 혼자 하기(결석생·복습): ${esc(u + (u.includes('?') ? '&' : '?') + 'solo=1')}</div>`; $('#qrModal').classList.add('on'); };
$('#qrClose').onclick = () => $('#qrModal').classList.remove('on');

const ox = (R, f) => R?.[f + '1'] == null ? '' : (R[f + '1'] === R._t ? 'O' : 'X') + (R[f + 'Tries'] ? `(${R[f + 'Tries']}번)` : '');
$('#bCsv').onclick = () => {
  const head = ['이름', '현재 위치', '완료', '모은 돈', '천직', ...TK.flatMap(k => [`${TYPES[k].short} 미니게임`, `${TYPES[k].short} 원인`, `${TYPES[k].short} 이름`, `${TYPES[k].short} 대책`]), '상담소 한 번에', '상담소 전체', '틀린 사례', '행인 판별(맞힘/만남)', '가장 억울한 실업', '한 줄'];
  const rows = Object.values(PL).sort((a, b) => String(a.name).localeCompare(String(b.name), 'ko')).map(p => [
    p.name, CHAPTERS[p.ch || 0]?.name || '', p.done ? 'O' : '', p.money || 0, JOBS[p.job]?.name || '',
    ...TK.flatMap(k => { const R = { ...(p.rec?.[k] || {}), _t: k }; return [k === 'fr' ? Object.values(R.scores || {}).join('/') : (R.score ?? ''), ox(R, 'cause'), ox(R, 'name'), ox(R, 'pol')]; }),
    p.quiz?.ok ?? '', p.quiz?.n ?? '', (p.quiz?.miss || []).map(id => caseById(id)?.x || id).join(' | '),
    `${Object.values(p.npc || {}).filter(Boolean).length}/${Object.keys(p.npc || {}).length}`, TYPES[p.essay?.t]?.short || '', p.essay?.x || '']);
  const csv = '﻿' + [head, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `실업시티_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.csv`; a.click();
};

/* 구독 */
store.onState(s => { S = s || {}; renderDock(); render(true); });
store.onPlayers(p => {
  PL = p || {};
  if (firstP) { firstP = false; const old = Date.now() - 12 * 3600e3; Object.entries(PL).forEach(([id, v]) => { if ((v.seen || 0) < old) store.delPlayer(id); }); }
  render();
});
setInterval(() => {
  $('#online').textContent = Object.values(PL).filter(online).length;
  const run = S.status === 'run' && S.startAt; $('#clock').textContent = run ? fmt((Date.now() - S.startAt) / 1000) : '0:00';
  const rc = recCh(); $('#rec').textContent = rc >= 0 ? `· 권장 ${CHAPTERS[rc].name}` : '';
}, 1000);
setInterval(() => { renderDock(); render(); }, 5000);
setInterval(() => { const a = Object.values(PL); if (S.status === 'run' && a.length) { hist.push(a.filter(p => !p.emp).length / a.length * 100); if (hist.length > 600) hist.shift(); render(); } }, 3000);

/* ───────── 화면 ───────── */
function render(force) {
  const st = S.status || 'lobby', arr = Object.values(PL);
  $('#online').textContent = arr.filter(online).length;
  const key = st + '|' + S.open + '|' + S.fast + '|' + hist.length + '|' + JSON.stringify(arr.map(p => [p.name, p.ch, p.step, p.done, online(p), p.quiz?.ok, p.job, p.emp, p.pos, p.essay?.x, Object.keys(p.npc || {}).length]));
  if (!force && key === stageKey) return; stageKey = key;
  const sc = $('#stage').scrollTop;
  $('#stage').innerHTML = st === 'lobby' ? lobbyHTML(arr) : st === 'end' ? endHTML(arr) : runHTML(arr);
  $('#stage').scrollTop = sc;
}
function namesHTML(arr) { return `<div class="names">${arr.length ? arr.sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0)).map(p => `<span class="nm ${online(p) ? '' : 'off'}">${esc(p.name)}</span>`).join('') : '<span class="nm off">아직 아무도 없어요</span>'}</div>`; }
function lobbyHTML(arr) {
  const u = studentURL();
  return `<div class="lobby">
    <div class="pn stripe qrcard"><div class="gt y" style="font-size:1.4rem">📱 찍고 들어와요</div>${qrSVG(u, 8)}<div class="url">${esc(u)}</div></div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div><div class="gt y" style="font-size:1.6rem;font-style:italic">백수 위기 탈출</div><h1 class="gt" style="font-size:4.4rem;font-style:italic">실업 시티</h1></div>
      <div class="talk">스무 살 <b>강근로</b>가 실업 시티에서 일자리를 구합니다. 그런데 일할 때마다 위기가…!<br>근로가 <b>왜</b> 일자리를 잃는지 추리하고, 마지막엔 상담원이 되어 주세요.</div>
      <div class="flow">${TK.map((k, i) => `<div class="fl" style="--c:${TYPES[k].c}"><div class="i">${['🥬', '🤖', '🍜', '🏢'][i]}</div><div class="n">MISSION ${i + 1}</div>${CHAPTERS[i + 1].place}</div>`).join('')}</div>
    </div></div>${namesHTML(arr)}`;
}
function pct(a, b) { return b ? Math.round(a / b * 100) : null; }
function firstBars(arr) {
  return `<div class="bars">${TK.map(k => {
    const T = TYPES[k], rs = arr.map(p => p.rec?.[k]).filter(r => r && r.cause1);
    const c = pct(rs.filter(r => r.cause1 === k).length, rs.length), n = pct(rs.filter(r => r.name1 === k).length, rs.filter(r => r.name1).length), po = pct(rs.filter(r => r.pol1 === k).length, rs.filter(r => r.pol1).length);
    return `<div class="bar"><span>${T.icon} ${T.short} · 원인</span><span class="tr"><i style="--c:${T.c};width:${c ?? 0}%"></i></span><span>${c == null ? '-' : c + '%'} <small style="opacity:.6">이름 ${n ?? '-'} · 대책 ${po ?? '-'}</small></span></div>`;
  }).join('')}</div>`;
}
function rateHTML(arr) {
  const out = arr.filter(p => !p.emp), r = arr.length ? Math.round(out.length / arr.length * 100) : 0, h = hist.slice(-200), n = Math.max(1, h.length - 1);
  const pts = h.map((v, i) => `${(i / n * 300).toFixed(1)},${(72 - v * .68).toFixed(1)}`).join(' ');
  const by = {}; out.forEach(p => { const k = CHAPTERS[p.ch || 0]?.t; if (k) by[k] = (by[k] || 0) + 1; });
  return `<div class="pn stripe"><p class="big3">📈 실업 시티 실업률 <small style="font-family:inherit;color:#fff;opacity:.6;font-size:.8rem">일자리가 없는 근로 ÷ 전체</small></p>
    <div style="display:flex;gap:16px;align-items:center"><div class="gt" style="font-size:4.4rem;color:${r >= 50 ? 'var(--r)' : 'var(--g)'}">${r}%</div>
      <svg viewBox="0 0 300 76" preserveAspectRatio="none" style="flex:1;height:96px;background:#000;border:2px solid var(--line)"><line x1="0" y1="38" x2="300" y2="38" stroke="#333" stroke-dasharray="4 4"/><polyline points="${pts}" fill="none" stroke="#ff4d6d" stroke-width="3"/></svg></div>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><span class="pill no">일자리 없음 ${out.length}명</span><span class="pill ok">일하는 중 ${arr.length - out.length}명</span>${TK.filter(k => by[k]).map(k => `<span class="pill" style="border-color:${TYPES[k].c};color:${TYPES[k].c}">${TYPES[k].icon} ${TYPES[k].short} 실직 ${by[k]}</span>`).join('')}</div></div>`;
}
function mapHTML(arr) {
  const M = UC.MAP;
  return `<div class="pn"><p class="big3">🗺️ 지금 근로들은 어디에? <small style="font-family:inherit;color:#fff;opacity:.6;font-size:.8rem">🟢 일하는 중 · 🔴 일자리 없음</small></p>
    <svg viewBox="0 0 ${M.W} ${M.H}" style="width:100%;display:block;background:#4a4d55;border:3px solid #000">
    ${M.bx.map(([x0, x1]) => M.by.map(([y0, y1]) => `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="#1f2228"/>`).join('')).join('')}
    ${M.b.map(([x, y, w, h, n]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${n === '공원' ? '#24402a' : n === '배추 농장' ? '#3d2c1a' : '#333945'}" stroke="#000" stroke-width="3"/><text x="${x + w / 2}" y="${y + h / 2 + 12}" text-anchor="middle" font-size="34" fill="#aab" font-family="Black Han Sans,sans-serif">${n}</text>`).join('')}
    ${arr.filter(p => p.pos).map(p => `<g opacity="${online(p) ? 1 : .35}"><circle cx="${p.pos[0]}" cy="${p.pos[1]}" r="17" fill="${p.emp ? '#7bd66b' : '#ff4d6d'}" stroke="#000" stroke-width="4"/><text x="${p.pos[0]}" y="${p.pos[1] - 24}" text-anchor="middle" font-size="28" fill="#fff" stroke="#000" stroke-width="5" paint-order="stroke" font-weight="800">${esc(String(p.name).split(' ').pop())}</text></g>`).join('')}
    </svg></div>`;
}
function runHTML(arr) {
  const open = S.open ?? 0, steps = [1, 6, 6, 6, 6, 2, 1];
  const SHORT = ['오프닝', '① 농장', '② 콜센터', '③ 식당', '④ 고용센터', '상담소', '엔딩'];
  const cols = CHAPTERS.map(c => {
    const here = arr.filter(p => (p.ch || 0) === c.n).sort((a, b) => (b.step || 0) - (a.step || 0));
    return `<div class="col ${c.n <= open ? 'open' : ''} ${c.n === open ? 'now' : ''}"><div class="hd"><span>${c.n <= open ? '' : '🔒 '}${SHORT[c.n]}</span><span>${here.length}</span></div>
      <div class="ls">${here.map(p => `<div class="st ${online(p) ? '' : 'off'} ${p.done ? 'done' : ''}">${esc(p.name)}<i style="width:${p.done ? 100 : Math.round(((p.step || 0) + 1) / steps[c.n] * 100)}%"></i></div>`).join('')}</div></div>`;
  }).join('');
  const waiting = arr.filter(p => (p.ch || 0) > open && online(p)).length;
  return `<div class="row2" style="grid-template-columns:1fr 1.15fr;align-items:start">${rateHTML(arr)}${mapHTML(arr)}</div><div class="board">${cols}</div>
    <div class="row2">
      <div class="pn stripe"><p class="big3">💬 지금 던질 질문 — ${CHAPTERS[open].name}</p><div class="talk">${TALK[open]}</div>
        ${waiting ? `<div class="pill" style="display:inline-block;margin-top:10px;border-color:var(--y);color:var(--y)">⏳ 다음 장을 기다리는 학생 ${waiting}명</div>` : ''}</div>
      <div class="pn"><p class="big3">🎯 한 번에 맞힌 비율 (원인 고르기)</p>${firstBars(arr)}</div>
    </div>`;
}
function endHTML(arr) {
  const done = arr.filter(p => p.done).length;
  const jobs = {}; arr.forEach(p => { if (p.job) jobs[p.job] = (jobs[p.job] || 0) + 1; });
  const jl = Object.entries(jobs).sort((a, b) => b[1] - a[1]), jm = Math.max(1, ...jl.map(j => j[1]));
  let qo = 0, qn = 0; const by = {}, cs = {};
  arr.forEach(p => { qo += p.quiz?.ok || 0; qn += p.quiz?.n || 0;
    Object.entries(p.quiz?.by || {}).forEach(([k, v]) => { by[k] = by[k] || { ok: 0, n: 0 }; by[k].ok += v.ok; by[k].n += v.n; });
    Object.entries(p.cs || {}).forEach(([id, v]) => { cs[id] = cs[id] || { ok: 0, n: 0 }; cs[id].n++; cs[id].ok += v; }); });
  const hard = Object.entries(cs).filter(([, v]) => v.n > v.ok).sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n || b[1].n - a[1].n).slice(0, 3);
  const WK = ['fr', 'st', 'cy', 'se', 'none'];
  return `<div style="display:flex;align-items:baseline;gap:14px"><h1 class="gt" style="font-size:2.6rem;font-style:italic">우리 반 실업 시티 결과</h1><span class="pill">완주 ${done} / ${arr.length}명</span></div>
    <div class="endgrid">
      <div class="pn stripe"><p class="big3">🧑‍🔧 우리 반 근로들의 천직</p><div class="bars">${jl.length ? jl.map(([j, n]) => `<div class="bar"><span>${JOBS[j].e} ${JOBS[j].name}</span><span class="tr"><i style="--c:var(--y);width:${n / jm * 100}%"></i></span><span>${n}명</span></div>`).join('') : '<div class="note">아직 취업한 학생이 없어요</div>'}</div></div>
      <div class="pn stripe"><p class="big3">🗂️ 상담소 — 한 번에 맞힌 비율 ${qn ? pct(qo, qn) + '%' : ''}</p><div class="bars">${WK.map(k => { const T = tinfo(k), v = by[k], r = v ? pct(v.ok, v.n) : null;
        return `<div class="bar"><span>${T.icon} ${T.short}</span><span class="tr"><i style="--c:${T.c};width:${r ?? 0}%"></i></span><span>${r == null ? '-' : r + '%'}</span></div>`; }).join('')}</div></div>
    </div>
    <div class="pn"><p class="big3">🤔 가장 헷갈린 사례 TOP 3 — 왜 그 창구일까?</p>${hard.length ? hard.map(([id, v]) => { const c = caseById(id), T = tinfo(c?.t);
      return `<div class="hc"><span class="e">${c?.e || ''}</span><span>"${esc(c?.x || id)}"<br><small style="opacity:.7">${T.why}</small></span><span class="b" style="--c:${T.c}">${T.icon} ${T.short} · ${pct(v.ok, v.n)}%</span></div>`; }).join('') : '<div class="note">헷갈린 사례가 없어요! 👏</div>'}</div>
    <div class="endgrid">
      <div class="pn"><p class="big3">✍️ 가장 억울했던 실업 — 근로들의 한마디</p>${TK.map(k => { const n = arr.filter(p => p.essay?.t === k).length; return n ? `<span class="pill" style="border-color:${TYPES[k].c};color:${TYPES[k].c};margin-right:6px">${TYPES[k].icon} ${TYPES[k].short} ${n}명</span>` : ''; }).join('')}
        <div style="max-height:260px;overflow:auto;margin-top:8px">${arr.filter(p => p.essay?.x).map(p => `<div class="hc" style="grid-template-columns:auto 1fr"><span class="b" style="--c:${TYPES[p.essay.t]?.c || '#999'}">${TYPES[p.essay.t]?.icon || ''}</span><span>${esc(p.essay.x)}</span></div>`).join('') || '<div class="note">아직 쓴 학생이 없어요</div>'}</div></div>
      <div class="pn"><p class="big3">💬 길에서 만난 사람 — 실업자일까? (한 번에 맞힌 비율)</p><div class="bars">${UC.NPCS.map(n => { const v = arr.map(p => p.npc?.[n.id]).filter(x => x != null), r = v.length ? pct(v.filter(Boolean).length, v.length) : null;
        return `<div class="bar"><span>${n.e} ${n.who}</span><span class="tr"><i style="--c:${n.ans === 'yes' ? 'var(--r)' : '#8d99ae'};width:${r ?? 0}%"></i></span><span>${r == null ? '-' : r + '%'} <small style="opacity:.6">${v.length}명 · ${n.ans === 'yes' ? '실업자' : '아님'}</small></span></div>`; }).join('')}</div></div>
    </div>
    <div class="pn"><p class="big3">📋 실업 4형제 비교표</p><div class="tbl"><div class="hd">실업</div><div class="hd">원인</div><div class="hd">스스로?</div><div class="hd">얼마나 갈까</div><div class="hd">대책</div>
      ${TK.map(k => { const T = TYPES[k]; return `<div class="ty" style="background:${T.c}">${T.icon} ${T.short}</div><div>${T.cause}</div><div>${T.vol}</div><div>${T.dur}</div><div>${POLICIES.find(p => p.k === k).x}</div>`; }).join('')}</div></div>
    <div class="pn"><p class="big3">🎯 미션에서 한 번에 맞힌 비율</p>${firstBars(arr)}</div>`;
}
render(true); renderDock();
})();
